<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Proyecto Parcial</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Unit Converter</h1>

    <input type="number" id="valor" placeholder="Enter value">

    <select id="tipo">
        <option value="">Select conversion</option>
        <option value="m-km">Meters to Kilometers</option>
        <option value="km-m">Kilometers to Meters</option>
        <option value="c-f">Celsius to Fahrenheit</option>
    </select>

    <button id="convertir">Convert</button>

    <p id="resultado"></p>

</div>

<script src="js/script.js"></script>

</body>
</html>
</body>
