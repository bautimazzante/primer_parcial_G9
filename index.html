<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Proyecto Parcial</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="container">

    <h1>Calculadora</h1>

    <label for="valor">Valor a convertir:</label>
        <input type="number" id="valor" placeholder="Ej: 100">
        <label for="tipo">Seleccionar conversión:</label>

    <select id="tipo">
        <option value="m-km">Metros a Kilómetros</option>
        <option value="km-m">Kilómetros a Metros</option>
        <option value="c-f">Celsius a Fahrenheit</option>
        <option value="f-c">Fahrenheit a Celsius</option>
        <option value="kg-lb">Kilogramos a Libras</option>
        <option value="lb-kg">Libras a Kilogramos</option>
        <option value="l-gal">Litros a Galones</option>
        <option value="gal-l">Galones a Litros</option>

    </select>

    <button id="convertir">Calcular</button>

    <p id="resultado">0</p>

</div>

<script src="js/script.js"></script>

</body>
</html>
</body>
